name: Validate Joomla release

on:
  push:
    branches:
      - main
    paths:
      - "updates/**"
      - "tools/validate_release.py"
      - ".github/workflows/validate-release.yml"
  pull_request:
    paths:
      - "updates/**"
      - "tools/validate_release.py"
      - ".github/workflows/validate-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate XML, manifests and checksums
        run: python3 tools/validate_release.py
      - name: Verify published GitHub Release asset
        if: github.event_name != 'pull_request'
        run: python3 tools/validate_release.py --check-remote
